<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>System LC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/tema.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-2 pb-5">
    <h5 class="mb-3">Bem-vindo(a)!</h5>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="border rounded p-3 h-100">
                <div class="text-muted small">Clientes ativos</div>
                <div class="fs-3 fw-bold" th:text="${totalClientesAtivos}">0</div>
                <div class="text-muted small" th:text="${totalClientes} + ' no total'">0 no total</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="border rounded p-3 h-100">
                <div class="text-muted small">Proximos 7 dias</div>
                <div class="fs-3 fw-bold" th:text="${proximosEventos.size()}">0</div>
                <div class="text-muted small">entregas, reunioes e eventos</div>
            </div>
        </div>
        <div class="col-12 col-md-6">
            <div class="border rounded p-3 h-100 d-flex flex-wrap align-items-center gap-2">
                <a th:href="@{/clientes/novo}" class="btn btn-sm btn-primary"
                   sec:authorize="hasAnyRole('ADMINISTRADOR','EDITOR','EDITOR_SENHAS')">+ Novo cliente</a>
                <a th:href="@{/calendario/novo}" class="btn btn-sm btn-outline-secondary">+ Novo evento</a>
                <a th:href="@{/clientes/planilha}" class="btn btn-sm btn-outline-secondary">Ver clientes (planilha)</a>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <h6>Proximos eventos <span class="text-muted small">(7 dias)</span></h6>
            <div class="list-group">
                <a th:each="evento : ${proximosEventos}" th:href="@{/calendario/{id}/editar(id=${evento.id})}"
                   class="list-group-item list-group-item-action d-flex justify-content-between align-items-start">
                    <div>
                        <span class="badge me-2"
                              th:classappend="${evento.tipo.name() == 'ENTREGA_IMPOSTO'} ? 'text-bg-danger' : (${evento.tipo.name() == 'REUNIAO'} ? 'text-bg-primary' : 'text-bg-secondary')"
                              th:text="${#temporals.format(evento.data, 'dd/MM')}"></span>
                        <span th:text="${evento.titulo}"></span>
                        <div class="text-muted small" th:if="${evento.clienteNome}" th:text="${evento.clienteNome}"></div>
                    </div>
                </a>
                <div th:if="${#lists.isEmpty(proximosEventos)}" class="text-muted small py-2">
                    Nada agendado para os proximos 7 dias.
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <h6>Minhas atualizacoes recentes</h6>
            <div class="list-group">
                <div th:each="log : ${minhasAtualizacoes}"
                     class="list-group-item d-flex justify-content-between align-items-start">
                    <div>
                        <span class="badge me-2"
                              th:classappend="${log.acao.name() == 'CRIACAO'} ? 'text-bg-success' : (${log.acao.name() == 'EDICAO'} ? 'text-bg-primary' : (${log.acao.name() == 'EXCLUSAO'} ? 'text-bg-danger' : 'text-bg-warning'))"
                              th:text="${log.acao.name() == 'CRIACAO'} ? 'Criacao' : (${log.acao.name() == 'EDICAO'} ? 'Edicao' : (${log.acao.name() == 'EXCLUSAO'} ? 'Exclusao' : 'Visualizacao'))">
                        </span>
                        <span th:text="${log.detalhes}"></span>
                        <div class="text-muted small" th:text="${#temporals.format(log.dataHora, 'dd/MM/yyyy HH:mm')}"></div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(minhasAtualizacoes)}" class="text-muted small py-2">
                    Nenhuma atualizacao sua registrada ainda.
                </div>
            </div>
        </div>
    </div>
</div>

<script th:replace="~{fragments/navbar :: scriptTema}"></script>
<script th:replace="~{fragments/navbar :: scriptNotificacoes}"></script>
</body>
</html>
