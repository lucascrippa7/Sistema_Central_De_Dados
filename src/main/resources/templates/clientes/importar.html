<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Importar clientes - System LC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/tema.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container pb-5" style="max-width: 36rem;">
    <h5 class="mb-3">Importar clientes via Excel</h5>

    <div class="alert alert-danger py-2" th:if="${erro}" th:text="${erro}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <p class="mb-2">
                A planilha precisa seguir o modelo abaixo (primeira linha é o
                cabeçalho, não mude a ordem das colunas).
            </p>
            <a th:href="@{/clientes/modelo-importacao}" class="btn btn-sm btn-outline-secondary">
                Baixar modelo em branco
            </a>
        </div>
    </div>

    <form th:action="@{/clientes/importar}" method="post" enctype="multipart/form-data" class="mb-4">
        <div class="mb-3">
            <label class="form-label">Arquivo (.xlsx)</label>
            <input type="file" name="arquivo" accept=".xlsx" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Importar</button>
        <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
    </form>

    <div th:if="${resultado}" class="card">
        <div class="card-body">
            <h6 class="card-title">Resultado da importação</h6>
            <p class="mb-2">
                <span th:text="${resultado.importados}"></span> de
                <span th:text="${resultado.totalLinhas}"></span> linha(s) importada(s) com sucesso.
            </p>

            <div th:if="${!#lists.isEmpty(resultado.erros)}">
                <p class="text-danger mb-1"><strong>Linhas com problema:</strong></p>
                <ul class="small text-danger">
                    <li th:each="erro : ${resultado.erros}" th:text="${erro}"></li>
                </ul>
            </div>

            <a th:href="@{/clientes}" class="btn btn-sm btn-outline-primary mt-2">Ver clientes</a>
        </div>
    </div>
</div>

<script th:replace="~{fragments/navbar :: scriptTema}"></script>
<script th:replace="~{fragments/navbar :: scriptNotificacoes}"></script>
</body>
</html>
