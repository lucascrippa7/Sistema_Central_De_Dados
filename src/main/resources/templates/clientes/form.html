<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicao} ? 'Editar cliente' : 'Novo cliente'">Cliente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/tema.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container pb-5" style="max-width: 40rem;">
    <h5 class="mb-3" th:text="${modoEdicao} ? 'Editar cliente' : 'Novo cliente'">Cliente</h5>

    <form th:action="${modoEdicao} ? @{/clientes/{id}/editar(id=${cliente.id})} : @{/clientes/novo}"
          th:object="${cliente}" method="post">

        <input type="hidden" th:if="${modoEdicao}" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Razao social *</label>
            <input type="text" id="campoRazaoSocial" th:field="*{razaoSocial}" class="form-control"
                   th:classappend="${#fields.hasErrors('razaoSocial')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('razaoSocial')}" th:errors="*{razaoSocial}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">CNPJ</label>
            <div class="d-flex gap-2" style="max-width: 24rem;">
                <input type="text" id="campoCnpj" th:field="*{cnpj}" class="form-control"
                       placeholder="00.000.000/0000-00">
                <button type="button" id="botaoBuscarCnpj" class="btn btn-outline-secondary text-nowrap">Buscar dados</button>
            </div>
            <div id="statusBuscaCnpj" class="form-text"></div>
            <div id="previewCnaes" class="small mt-1"></div>
            <input type="hidden" id="cnaesSugeridosJson" name="cnaesSugeridosJson" value="">
        </div>

        <div class="mb-3">
            <label class="form-label">Nome fantasia</label>
            <input type="text" id="campoNomeFantasia" th:field="*{nomeFantasia}" class="form-control">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Regime tributario</label>
                <select id="campoRegimeTributario" th:field="*{regimeTributario}" class="form-select">
                    <option value="">Selecione</option>
                    <option value="Simples Nacional">Simples Nacional</option>
                    <option value="Lucro Presumido">Lucro Presumido</option>
                    <option value="Lucro Real">Lucro Real</option>
                    <option value="MEI">MEI</option>
                </select>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Cidade</label>
                <input type="text" id="campoCidade" th:field="*{cidade}" class="form-control">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">UF</label>
                <input type="text" id="campoEstado" th:field="*{estado}" maxlength="2" class="form-control text-uppercase">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de servico</label>
            <input type="text" th:field="*{tipoServico}" class="form-control"
                   placeholder="Ex: Contabilidade, Consultoria, etc.">
        </div>

        <div class="mb-3">
            <label class="form-label">Descricao do servico</label>
            <textarea th:field="*{descricaoServico}" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoria de redução IBS/CBS <span class="text-muted small">(LC 214/2025, usada no comparativo de regime)</span></label>
            <select th:field="*{categoriaReducaoLc214}" class="form-select">
                <option value="">— Não definido (alíquota cheia) —</option>
                <option th:each="r : ${reducoes}" th:value="${r.codigo}"
                        th:text="${r.categoria} + ' (' + ${#numbers.formatDecimal(r.percentualReducao,1,0)} + '%)'"></option>
            </select>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Inscricao municipal</label>
                <input type="text" th:field="*{inscricaoMunicipal}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Inscricao estadual</label>
                <input type="text" th:field="*{inscricaoEstadual}" class="form-control">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Codigo em outro sistema</label>
            <input type="text" th:field="*{codigoSistemaExterno}" class="form-control" style="max-width: 14rem;"
                   placeholder="Ex: codigo desse cliente na Dominio">
        </div>

        <div class="mb-3">
            <label class="form-label">Responsavel pela empresa</label>
            <select name="responsavelId" class="form-select">
                <option value="">Nenhum</option>
                <option th:each="usuario : ${usuarios}"
                        th:value="${usuario.id}"
                        th:text="${usuario.nome}"
                        th:selected="${cliente.responsavel != null and cliente.responsavel.id == usuario.id}">
                </option>
            </select>
        </div>

        <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" th:field="*{ativo}" role="switch">
            <label class="form-check-label">Cliente ativo</label>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="${modoEdicao} ? @{/clientes/{id}(id=${cliente.id})} : @{/clientes}"
           class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>

<script th:replace="~{fragments/navbar :: scriptTema}"></script>
<script th:replace="~{fragments/navbar :: scriptNotificacoes}"></script>
<script>
    document.getElementById('botaoBuscarCnpj').addEventListener('click', async function () {
        const cnpjDigitado = document.getElementById('campoCnpj').value;
        const cnpjLimpo = cnpjDigitado.replace(/\D/g, '');
        const status = document.getElementById('statusBuscaCnpj');

        if (cnpjLimpo.length !== 14) {
            status.textContent = 'Digite um CNPJ valido (14 numeros) antes de buscar.';
            status.className = 'form-text text-danger';
            return;
        }

        status.textContent = 'Buscando...';
        status.className = 'form-text text-muted';

        try {
            const resposta = await fetch('/api/cnpj/' + cnpjLimpo);
            if (!resposta.ok) {
                status.textContent = 'CNPJ nao encontrado -- confira o numero ou preencha manualmente.';
                status.className = 'form-text text-warning';
                return;
            }
            const dados = await resposta.json();
            if (dados.razaoSocial) document.getElementById('campoRazaoSocial').value = dados.razaoSocial;
            if (dados.nomeFantasia) document.getElementById('campoNomeFantasia').value = dados.nomeFantasia;
            if (dados.cidade) document.getElementById('campoCidade').value = dados.cidade;
            if (dados.estado) document.getElementById('campoEstado').value = dados.estado;
            if (dados.regimeTributario) document.getElementById('campoRegimeTributario').value = dados.regimeTributario;

            const preview = document.getElementById('previewCnaes');
            const campoOculto = document.getElementById('cnaesSugeridosJson');
            if (dados.cnaes && dados.cnaes.length > 0) {
                campoOculto.value = JSON.stringify(dados.cnaes);
                const lista = dados.cnaes.map(function (c) {
                    return c.codigo + (c.principal ? ' (principal)' : '') + (c.descricao ? ' - ' + c.descricao : '');
                }).join('<br>');
                preview.innerHTML = '<strong>CNAEs que serao adicionados ao salvar:</strong><br>' + lista;
            } else {
                campoOculto.value = '';
                preview.innerHTML = '';
            }

            status.textContent = dados.regimeTributario
                ? 'Dados preenchidos -- confira antes de salvar.'
                : 'Dados preenchidos -- so o Regime Tributario nao deu pra detectar automaticamente (Lucro Presumido/Real nao aparecem nessa consulta), selecione na mao.';
            status.className = 'form-text text-success';
        } catch (e) {
            status.textContent = 'Nao foi possivel consultar agora (sem internet ou servico fora do ar). Preencha manualmente.';
            status.className = 'form-text text-danger';
        }
    });
</script>
</body>
</html>
