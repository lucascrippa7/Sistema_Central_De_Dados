<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comparativo de Regime Tributário</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/tema.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container pb-5">
    <a th:href="@{/clientes/{id}(id=${cliente.id})}" class="btn btn-sm btn-outline-secondary mb-3">← Voltar ao cliente</a>
    <h5 class="mb-1">Comparativo de regime tributário</h5>
    <p class="text-muted small" th:text="${cliente.razaoSocial}"></p>

    <div class="alert alert-warning small" th:text="${resultado.aviso}"></div>

    <form method="get" class="row g-2 align-items-end mb-4">
        <div class="col-auto">
            <label class="form-label small mb-0">Ano</label>
            <input type="number" name="ano" class="form-control form-control-sm" th:value="${ano}">
        </div>
        <div class="col-auto">
            <label class="form-label small mb-0">Setor</label>
            <select name="setor" class="form-select form-select-sm">
                <option value="COMERCIO" th:selected="${input.setor.name() == 'COMERCIO'}">Comércio</option>
                <option value="INDUSTRIA" th:selected="${input.setor.name() == 'INDUSTRIA'}">Indústria</option>
                <option value="SERVICOS" th:selected="${input.setor.name() == 'SERVICOS'}">Serviços</option>
            </select>
        </div>
        <div class="col-auto">
            <label class="form-label small mb-0">Alíquota ISS (%) <span class="text-muted">(se serviço)</span></label>
            <input type="number" step="0.01" name="aliquotaIss" class="form-control form-control-sm" th:value="${input.aliquotaIss}">
        </div>
        <div class="col-auto">
            <label class="form-label small mb-0">Margem de lucro estimada (%) <span class="text-muted">(p/ Lucro Real)</span></label>
            <input type="number" step="0.01" name="margemLucroEstimada" class="form-control form-control-sm" th:value="${input.margemLucroEstimada}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-sm btn-primary">Recalcular</button>
        </div>
    </form>

    <table class="table table-sm w-auto mb-4">
        <tbody>
            <tr><th>Faturamento usado (ano)</th><td th:text="${#numbers.formatDecimal(resultado.faturamentoUsado, 1, 2)}"></td></tr>
            <tr><th>Créditos de compra usados (ICMS+PIS+COFINS, Fase 3)</th>
                <td th:text="${#numbers.formatDecimal(resultado.creditoIcmsUsado.add(resultado.creditoPisUsado).add(resultado.creditoCofinsUsado), 1, 2)}"></td></tr>
            <tr><th>Categoria de redução LC 214/2025</th><td th:text="${resultado.categoriaReducaoUsada}"></td></tr>
        </tbody>
    </table>

    <div class="row g-3">
        <div class="col-md-6 col-lg-3" th:each="regime : ${resultado.regimes}">
            <div class="card h-100" th:classappend="${regime.nome == resultado.melhorRegimeNome} ? 'border-success border-2' : ''">
                <div class="card-body">
                    <h6 class="card-title">
                        <span th:text="${regime.nome}"></span>
                        <span class="badge bg-success ms-1" th:if="${regime.nome == resultado.melhorRegimeNome}">Melhor opção</span>
                    </h6>
                    <p class="fs-4 mb-0" th:text="${#numbers.formatDecimal(regime.cargaTributariaEstimada, 1, 2)}"></p>
                    <p class="text-muted small mb-2" th:text="${#numbers.formatDecimal(regime.percentualSobreFaturamento, 1, 2)} + '% do faturamento'"></p>
                    <p class="small text-muted" th:text="${regime.detalhamento}"></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
