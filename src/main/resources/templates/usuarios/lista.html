<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuários - System LC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/tema.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Usuários</h5>
        <div class="d-flex gap-2">
            <a th:href="@{/usuarios/exportar/opcoes}" class="btn btn-outline-secondary btn-sm">Exportar Excel</a>
            <a th:href="@{/usuarios/novo}" class="btn btn-primary btn-sm">+ Novo usuário</a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-sm table-hover align-middle">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Login</th>
                    <th>Cargo</th>
                    <th>Tipo de acesso</th>
                    <th>Status</th>
                    <th class="text-end">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.nome}"></td>
                    <td th:text="${usuario.login}"></td>
                    <td th:text="${usuario.cargo}"></td>
                    <td th:text="${usuario.tipoAcesso}"></td>
                    <td>
                        <span class="badge" th:classappend="${usuario.ativo} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${usuario.ativo} ? 'Ativo' : 'Inativo'"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/usuarios/{id}/editar(id=${usuario.id})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                        <a th:href="@{/usuarios/{id}/redefinir-senha(id=${usuario.id})}" class="btn btn-sm btn-outline-secondary">Redefinir senha</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="text-center text-muted py-4">Nenhum usuário cadastrado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:replace="~{fragments/navbar :: scriptTema}"></script>
<script th:replace="~{fragments/navbar :: scriptNotificacoes}"></script>
</body>
</html>
