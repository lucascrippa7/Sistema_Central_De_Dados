<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Redefinir senha - System LC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/tema.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container pb-5" style="max-width: 28rem;">
    <h5 class="mb-1">Redefinir senha</h5>
    <p class="text-muted small mb-3">
        Usuário: <strong th:text="${usuario.nome}">Nome</strong>
        (<span th:text="${usuario.login}">login</span>)
    </p>

    <div class="alert alert-danger py-2" th:if="${erro}" th:text="${erro}"></div>

    <form th:action="@{/usuarios/{id}/redefinir-senha(id=${usuario.id})}" method="post">
        <div class="mb-3">
            <label class="form-label">Nova senha *</label>
            <input type="password" name="novaSenha" class="form-control" minlength="6" required>
            <div class="form-text">Pelo menos 6 caracteres. Avise o usuário da nova senha por fora do sistema.</div>
        </div>

        <button type="submit" class="btn btn-primary">Redefinir</button>
        <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>

<script th:replace="~{fragments/navbar :: scriptTema}"></script>
<script th:replace="~{fragments/navbar :: scriptNotificacoes}"></script>
</body>
</html>
