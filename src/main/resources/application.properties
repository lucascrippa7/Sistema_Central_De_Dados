# ==========================================================
# Configuracao do banco de dados PostgreSQL
# Ajuste host/porta/usuario/senha conforme o servidor da empresa
# ==========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_clientes
spring.datasource.username=postgres
spring.datasource.password=Lrc02deus@

# O Flyway cria e versiona as tabelas (veja src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================================
# Chave usada para CRIPTOGRAFAR as senhas dos portais (Giss Online,
# Ginfes, Nota do Milhao, etc). NUNCA deixe uma chave real aqui no
# arquivo -- em producao, defina a variavel de ambiente abaixo.
# Gere uma chave forte, por exemplo com: openssl rand -base64 32
# ==========================================================
app.seguranca.chave-criptografia=${APP_CHAVE_CRIPTOGRAFIA:chave-temporaria-so-para-rodar-local-troque-isto}

server.port=8080

# Nome exibido no sistema (aparece no topo das telas)
app.nome=Sistema de Clientes
