<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minha conta - System LC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/tema.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container pb-5" style="max-width: 28rem;">
    <h5 class="mb-3">Minha conta</h5>

    <h6 class="text-muted">E-mail para notificacoes</h6>
    <div class="alert alert-success py-2" th:if="${sucessoEmail}">E-mail atualizado com sucesso.</div>
    <form th:action="@{/conta/email}" method="post" class="mb-4">
        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" th:value="${emailAtual}" class="form-control"
                   placeholder="seu.email@empresa.com.br">
            <div class="form-text">Usado pra receber os avisos de calendario por e-mail (entregas, reunioes, eventos).</div>
        </div>
        <button type="submit" class="btn btn-outline-primary btn-sm">Salvar e-mail</button>
    </form>

    <hr>

    <h6 class="text-muted">Trocar minha senha</h6>
    <div class="alert alert-success py-2" th:if="${sucesso}">Senha alterada com sucesso.</div>
    <div class="alert alert-danger py-2" th:if="${erro}" th:text="${erro}"></div>

    <form th:action="@{/conta/senha}" method="post">
        <div class="mb-3">
            <label class="form-label">Senha atual *</label>
            <input type="password" name="senhaAtual" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nova senha *</label>
            <input type="password" name="novaSenha" class="form-control" minlength="6" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Confirmar nova senha *</label>
            <input type="password" name="confirmarSenha" class="form-control" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary">Trocar senha</button>
    </form>
</div>

<script th:replace="~{fragments/navbar :: scriptTema}"></script>
<script th:replace="~{fragments/navbar :: scriptNotificacoes}"></script>
</body>
</html>
