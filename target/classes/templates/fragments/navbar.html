<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="navbar">
<nav class="navbar navbar-expand-lg navbar-lc mb-4" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <span class="marca-selo">LC</span>
            <span>System LC</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${uriAtual != null and uriAtual == '/dashboard'} ? 'active'"
                       th:href="@{/dashboard}">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${uriAtual != null and uriAtual.startsWith('/clientes')} ? 'active'"
                       th:href="@{/clientes}">Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${uriAtual != null and uriAtual.startsWith('/calendario')} ? 'active'"
                       th:href="@{/calendario}">Calendario</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${uriAtual != null and uriAtual.startsWith('/reforma-tributaria')} ? 'active'"
                       th:href="@{/reforma-tributaria}">Reforma Tributária</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                    <a class="nav-link" th:classappend="${uriAtual != null and uriAtual.startsWith('/usuarios')} ? 'active'"
                       th:href="@{/usuarios}">Usuários</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                    <a class="nav-link" th:classappend="${uriAtual != null and uriAtual.startsWith('/auditoria')} ? 'active'"
                       th:href="@{/auditoria}">Auditoria</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3 flex-wrap">
                <div class="dropdown">
                    <button class="btn btn-sm btn-navbar position-relative" type="button"
                            id="botaoNotificacoes" data-bs-toggle="dropdown" aria-expanded="false"
                            onclick="atualizarNotificacoes()">
                        🔔
                        <span id="badgeNotificacoes"
                              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              style="display:none;"></span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end p-0" style="min-width: 20rem;" id="listaNotificacoes"></div>
                </div>
                <span class="texto-usuario small">
                    Ola, <span sec:authentication="name">usuario</span>
                    (<span sec:authentication="principal.tipoAcesso">perfil</span>)
                </span>
                <a th:href="@{/conta/senha}" class="btn btn-sm btn-navbar">Minha conta</a>
                <button id="botaoTema" class="btn btn-sm btn-navbar" type="button">🌓 Tema</button>
                <form th:action="@{/logout}" method="post" class="mb-0">
                    <button class="btn btn-sm btn-navbar-danger" type="submit">Sair</button>
                </form>
            </div>
        </div>
    </div>
</nav>
<div class="container-fluid" th:if="${erroGeral}">
    <div class="alert alert-danger alert-dismissible py-2 mt-n3 mb-3" role="alert">
        <span th:text="${erroGeral}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
</div>
<!-- O JS do Bootstrap (dropdown, collapse, etc) nunca tinha sido incluido em
     lugar nenhum -- so o CSS. Colocado aqui porque a navbar e' incluida em
     TODA pagina, entao isso garante que carrega em todo lugar de uma vez so,
     sem precisar mexer em cada template individualmente. -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
<script th:fragment="scriptTema">
    const raiz = document.documentElement;
    const botao = document.getElementById('botaoTema');
    const temaSalvo = localStorage.getItem('tema') || 'light';
    raiz.setAttribute('data-bs-theme', temaSalvo);

    botao.addEventListener('click', () => {
        const atual = raiz.getAttribute('data-bs-theme');
        const novo = atual === 'dark' ? 'light' : 'dark';
        raiz.setAttribute('data-bs-theme', novo);
        localStorage.setItem('tema', novo);
    });
</script>
<script th:fragment="scriptNotificacoes">
    async function atualizarNotificacoes() {
        try {
            const resposta = await fetch('/notificacoes/fragmento');
            if (!resposta.ok) return;
            const html = await resposta.text();
            document.getElementById('listaNotificacoes').innerHTML = html;

            const quantidade = document.querySelectorAll('#listaNotificacoes a.dropdown-item').length;
            const badge = document.getElementById('badgeNotificacoes');
            if (quantidade > 0) {
                badge.textContent = quantidade;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        } catch (e) {
            // Silencioso -- o sininho so nao atualiza, nao precisa incomodar o usuario.
        }
    }
    atualizarNotificacoes();
    setInterval(atualizarNotificacoes, 60000);
</script>
</body>
</html>
