<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicao} ? 'Editar usuário' : 'Novo usuário'">Usuário</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/tema.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container pb-5" style="max-width: 32rem;">
    <h5 class="mb-3" th:text="${modoEdicao} ? 'Editar usuário' : 'Novo usuário'">Usuário</h5>

    <div class="alert alert-danger py-2" th:if="${erro}" th:text="${erro}"></div>

    <form th:action="${modoEdicao} ? @{/usuarios/{id}/editar(id=${usuario.id})} : @{/usuarios/novo}"
          th:object="${usuario}" method="post">

        <input type="hidden" th:if="${modoEdicao}" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nome *</label>
            <input type="text" th:field="*{nome}" class="form-control"
                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Login *</label>
            <input type="text" th:field="*{login}" class="form-control"
                   th:classappend="${#fields.hasErrors('login')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" th:field="*{email}" class="form-control">
            <div class="form-text">Usado so para receber notificacoes de eventos por e-mail. Pode deixar em branco.</div>
        </div>

        <div class="mb-3" th:unless="${modoEdicao}">
            <label class="form-label">Senha inicial *</label>
            <input type="password" th:field="*{senha}" class="form-control" minlength="6"
                   th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
            <div class="form-text">O usuário poderá trocar depois em "Minha conta".</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Cargo</label>
            <input type="text" th:field="*{cargo}" class="form-control"
                   placeholder="Ex: Contador, Assistente fiscal...">
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de acesso *</label>
            <select th:field="*{tipoAcesso}" class="form-select"
                    th:classappend="${#fields.hasErrors('tipoAcesso')} ? 'is-invalid'">
                <option value="">Selecione</option>
                <option value="VISUALIZADOR">Visualizador (só consulta)</option>
                <option value="EDITOR">Editor (cadastra e edita)</option>
                <option value="EDITOR_SENHAS">Editor de senhas (edita e gerencia credenciais)</option>
                <option value="ADMINISTRADOR">Administrador (acesso total)</option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('tipoAcesso')}" th:errors="*{tipoAcesso}"></div>
        </div>

        <div class="form-check form-switch mb-4" th:if="${modoEdicao}">
            <input class="form-check-input" type="checkbox" th:field="*{ativo}" role="switch">
            <label class="form-check-label">Usuário ativo</label>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>

<script th:replace="~{fragments/navbar :: scriptTema}"></script>
<script th:replace="~{fragments/navbar :: scriptNotificacoes}"></script>
</body>
</html>
