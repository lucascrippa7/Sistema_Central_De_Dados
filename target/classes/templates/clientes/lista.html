<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Clientes - System LC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/tema.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Clientes</h5>
        <div class="d-flex gap-2">
            <a th:href="@{/clientes(meusClientes=${!meusClientes})}"
               th:classappend="${meusClientes} ? 'btn-secondary' : 'btn-outline-secondary'"
               class="btn btn-sm">
                <span th:text="${meusClientes} ? 'Mostrando: meus clientes' : 'Meus clientes'"></span>
            </a>
            <a th:href="@{/clientes/planilha(termo=${termo},estado=${estado},regimeTributario=${regimeTributario},ativo=${ativo},codigoSistemaExterno=${codigoSistemaExterno})}"
               class="btn btn-outline-secondary btn-sm">
                Ver como planilha
            </a>
            <a th:href="@{/clientes/exportar/opcoes(termo=${termo},estado=${estado},regimeTributario=${regimeTributario},ativo=${ativo},codigoSistemaExterno=${codigoSistemaExterno})}"
               class="btn btn-outline-secondary btn-sm">
                Exportar Excel
            </a>
            <a th:href="@{/clientes/importar}" class="btn btn-outline-secondary btn-sm"
               sec:authorize="hasAnyRole('ADMINISTRADOR','EDITOR','EDITOR_SENHAS')">
                Importar Excel
            </a>
            <a th:href="@{/clientes/novo}" class="btn btn-primary btn-sm"
               sec:authorize="hasAnyRole('ADMINISTRADOR','EDITOR','EDITOR_SENHAS')">
                + Novo cliente
            </a>
        </div>
    </div>

    <form th:action="@{/clientes}" method="get" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="termo" th:value="${termo}" class="form-control form-control-sm"
                   placeholder="Buscar por razao social ou nome fantasia">
        </div>
        <div class="col-auto">
            <input type="text" name="estado" th:value="${estado}" class="form-control form-control-sm"
                   placeholder="UF" maxlength="2" style="width: 5rem;">
        </div>
        <div class="col-auto">
            <select name="regimeTributario" class="form-select form-select-sm">
                <option value="" th:selected="${regimeTributario == null or regimeTributario == ''}">Todos os regimes</option>
                <option value="Simples Nacional" th:selected="${regimeTributario == 'Simples Nacional'}">Simples Nacional</option>
                <option value="Lucro Presumido" th:selected="${regimeTributario == 'Lucro Presumido'}">Lucro Presumido</option>
                <option value="Lucro Real" th:selected="${regimeTributario == 'Lucro Real'}">Lucro Real</option>
                <option value="MEI" th:selected="${regimeTributario == 'MEI'}">MEI</option>
            </select>
        </div>
        <div class="col-auto">
            <select name="ativo" class="form-select form-select-sm">
                <option value="" th:selected="${ativo == null}">Todos os status</option>
                <option value="true" th:selected="${ativo != null and ativo == true}">Somente ativos</option>
                <option value="false" th:selected="${ativo != null and ativo == false}">Somente inativos</option>
            </select>
        </div>
        <div class="col-auto">
            <input type="text" name="codigoSistemaExterno" th:value="${codigoSistemaExterno}" class="form-control form-control-sm"
                   placeholder="Codigo no outro sistema" style="width: 12rem;">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary btn-sm">Filtrar</button>
            <a th:href="@{/clientes}" class="btn btn-outline-secondary btn-sm">Limpar</a>
        </div>
        <input type="hidden" name="meusClientes" th:value="${meusClientes}">
    </form>

    <div class="table-responsive">
        <table class="table table-sm table-hover align-middle">
            <thead>
                <tr>
                    <th>Razao social</th>
                    <th>Cidade/UF</th>
                    <th>Regime</th>
                    <th>Tipo de servico</th>
                    <th>Cod. outro sistema</th>
                    <th>Status</th>
                    <th class="text-end">Acoes</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td>
                        <a th:href="@{/clientes/{id}(id=${cliente.id})}" th:text="${cliente.razaoSocial}">Empresa</a>
                        <div class="text-muted small" th:if="${cliente.nomeFantasia}" th:text="${cliente.nomeFantasia}"></div>
                    </td>
                    <td th:text="${cliente.cidade} + ' / ' + ${cliente.estado}"></td>
                    <td th:text="${cliente.regimeTributario}"></td>
                    <td th:text="${cliente.tipoServico}"></td>
                    <td th:text="${cliente.codigoSistemaExterno}"></td>
                    <td>
                        <span class="badge" th:classappend="${cliente.ativo} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${cliente.ativo} ? 'Ativo' : 'Inativo'"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/clientes/{id}(id=${cliente.id})}" class="btn btn-sm btn-outline-secondary">Ver</a>
                        <a th:href="@{/clientes/{id}/editar(id=${cliente.id})}" class="btn btn-sm btn-outline-secondary"
                           sec:authorize="hasAnyRole('ADMINISTRADOR','EDITOR','EDITOR_SENHAS')">Editar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="7" class="text-center text-muted py-4">Nenhum cliente encontrado.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-2">
        <p class="text-muted small mb-0" th:text="${totalElementos} + ' cliente(s) encontrado(s)'">0 cliente(s)</p>
        <nav th:if="${totalPaginas > 1}" aria-label="Paginacao de clientes">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${!temAnterior} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/clientes(termo=${termo},estado=${estado},regimeTributario=${regimeTributario},ativo=${ativo},codigoSistemaExterno=${codigoSistemaExterno},meusClientes=${meusClientes},pagina=${paginaAtual - 1})}">
                        Anterior
                    </a>
                </li>
                <li class="page-item disabled">
                    <span class="page-link" th:text="'Pagina ' + (${paginaAtual} + 1) + ' de ' + ${totalPaginas}">Pagina</span>
                </li>
                <li class="page-item" th:classappend="${!temProxima} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/clientes(termo=${termo},estado=${estado},regimeTributario=${regimeTributario},ativo=${ativo},codigoSistemaExterno=${codigoSistemaExterno},meusClientes=${meusClientes},pagina=${paginaAtual + 1})}">
                        Proxima
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<script th:replace="~{fragments/navbar :: scriptTema}"></script>
<script th:replace="~{fragments/navbar :: scriptNotificacoes}"></script>
</body>
</html>
